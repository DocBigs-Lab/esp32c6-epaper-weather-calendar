; Seengreat ESP32-C6 E-Paper Driver Board + 4,2" BWR-Panel (SES-imagotag)
; ESP32-C6 braucht Arduino-Core 3.x -> pioarduino-Plattform statt der offiziellen espressif32
;
; Umgebung wählen:  pio run -e <name> -t upload
;   wetter42   4,2"  Wetter + Termine (Hauptanwendung, Standard)
;   epd42      4,2"  Testbild zum Prüfen von Panel und Verkabelung
;   schlaftest  Board sofort in Deep Sleep (Schlafstrom ohne Display/WLAN messen)

[platformio]
default_envs = wetter42

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Jede Umgebung kompiliert nur ihr eigenes Programm
build_src_filter = -<*> +<main_gxepd2.cpp>
lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library

[env:wetter42]
build_src_filter = -<*> +<wetter/>
board_build.partitions = huge_app.csv   ; 3 MB für App (WLAN + HTTPS), kein OTA
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2_for_Adafruit_GFX
    bblanchon/ArduinoJson@^7
; Zum Testen statt des Zeitplans alle N Minuten aktualisieren:
; build_flags = ${env.build_flags} -D TEST_SCHLAF_MIN=5

[env:epd42]

[env:schlaftest]
build_src_filter = -<*> +<schlaftest.cpp>
lib_deps =
